# NOTE: This Express backend cannot run on Netlify (no server runtime)
# Netlify only supports:
# 1. Static sites
# 2. Netlify Functions (serverless)
# 3. Edge Functions
#
# To deploy this Express backend, use one of these services:
# - Render.com (recommended)
# - Railway.app
# - Heroku
# - DigitalOcean App Platform
# - AWS Elastic Beanstalk
# - Google Cloud Run
#
# For now, this file is kept for documentation purposes only.

[build]
command = "npm ci && npm run build"
publish = "dist"

[env]
[env.production]
NODE_ENV = "production"

