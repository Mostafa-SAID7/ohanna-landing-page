<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#1B1B1B"/>
  
  <!-- Eye of Horus Symbol -->
  <g transform="translate(90, 90)">
    <!-- Main eye shape -->
    <path d="M -30 -5 Q -30 -20, -15 -25 Q 0 -28, 15 -25 Q 30 -20, 30 -5 Q 30 10, 15 15 Q 0 18, -15 15 Q -30 10, -30 -5 Z" 
          fill="#C89D29" stroke="#C89D29" stroke-width="2"/>
    
    <!-- Pupil -->
    <circle cx="0" cy="-5" r="8" fill="#1B1B1B"/>
    
    <!-- Inner highlight -->
    <circle cx="-2" cy="-7" r="3" fill="#FDF8EF" opacity="0.8"/>
    
    <!-- Eyebrow/top line -->
    <path d="M -35 -30 Q 0 -35, 35 -30" 
          stroke="#C89D29" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Bottom spiral (characteristic of Eye of Horus) -->
    <path d="M 30 -5 Q 35 5, 30 15 Q 25 20, 20 18" 
          stroke="#C89D29" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Tear mark (vertical line below eye) -->
    <path d="M 0 15 L 0 35" 
          stroke="#C89D29" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Small decorative marks -->
    <circle cx="-25" cy="20" r="2" fill="#C89D29"/>
    <circle cx="10" cy="30" r="2" fill="#C89D29"/>
  </g>
</svg>